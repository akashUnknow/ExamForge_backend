spring:
  application:
    name: examforge-backend

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/examforge}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
        default_schema: public

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    redis:
      enabled: true
    db:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  level:
    root: INFO
    com.examforge: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

examforge:
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_IN_PRODUCTION_use_a_long_random_secret_value}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}
  attempt:
    # How often the background sweep checks for IN_PROGRESS attempts past
    # their expiresAt that nobody has revisited (the lazy per-request check
    # only catches an expired attempt when someone touches it again).
    sweep-interval-ms: ${ATTEMPT_SWEEP_INTERVAL_MS:60000}
  storage:
    # Local-disk base directory for uploaded study material files. See
    # common.storage.FileStorageService - this is a single-instance/dev
    # implementation; a production multi-instance deployment should use
    # an S3-compatible implementation against the same interface instead.
    local-path: ${STORAGE_LOCAL_PATH:./storage}
